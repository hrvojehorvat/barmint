<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mrvoje to hrvoje morph</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4a4d55}a:hover{color:#111318}
.mv-asc{transform-box:fill-box;transform-origin:50% 100%;animation:mvAsc 6s ease-in-out infinite}
.mv-leg{animation:mvLeg 6s ease-in-out infinite}
.mv-rest{animation:mvRest 6s ease-in-out infinite}
@keyframes mvAsc{0%,38%{transform:scaleY(0)}50%,88%{transform:scaleY(1)}100%{transform:scaleY(0)}}
@keyframes mvLeg{0%,38%{opacity:1}50%,88%{opacity:0}100%{opacity:1}}
@keyframes mvRest{0%,38%{transform:translateX(0)}50%,88%{transform:translateX(-32px)}100%{transform:translateX(0)}}
@media (prefers-reduced-motion: reduce){.mv-asc,.mv-leg,.mv-rest{animation:none}}
</style>
</helmet>
<div style="width: 640px; height: 420px; box-sizing: border-box; background: #F4F3EE; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px">
<svg role="img" aria-label="mrvoje morphing into hrvoje" width="440" height="150" viewBox="-6 10 340 135" fill="none" stroke="#111318" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
<path class="mv-asc" d="M6,50 V20" stroke="{{accent}}"></path>
<path d="M6,100 V62 Q6,50 22,50 Q38,50 38,62 V100"></path>
<path class="mv-leg" d="M38,62 Q38,50 54,50 Q70,50 70,62 V100"></path>
<g class="mv-rest">
<path d="M86,100 V62 Q86,50 100,50 H112"></path>
<path d="M126,50 L146,100 L166,50"></path>
<ellipse cx="198" cy="75" rx="19" ry="25"></ellipse>
<path d="M244,50 V115 Q244,128 230,128"></path>
<circle cx="244" cy="30" r="6.5" fill="#111318" stroke="none"></circle>
<path d="M268,75 H304 Q304,50 286,50 Q268,50 268,75 Q268,100 286,100 Q298,100 303,92"></path>
</g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E8501A","options":["#E8501A","#2F6BFF","#11A36A","#111318"]},"$preview":{"width":640,"height":420}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#E8501A' };
}
}
</script>
</body>
</html>
