@let tt = t();

<div appCard class="p-6">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-sm font-semibold text-neutral-900 dark:text-white">{{ tt.preview }}</h2>
    @if (caption()) {
      <span class="text-xs text-neutral-400">{{ caption() }}</span>
    }
  </div>

  <div class="relative flex aspect-square items-center justify-center overflow-hidden rounded-2xl bg-white ring-1 ring-black/5 p-6">
    <canvas
      #canvas
      [class]="ready() ? 'opacity-100 transition-opacity duration-300' : 'opacity-0'"
      style="max-width: 100%; max-height: 100%; width: auto; height: auto; image-rendering: pixelated"
    ></canvas>
    @if (!ready()) {
      <div class="absolute inset-0 flex flex-col items-center justify-center gap-3 p-8 text-center">
        <svg lucideScanLine class="h-10 w-10 text-neutral-300" [strokeWidth]="1.5"></svg>
        <p class="text-sm text-neutral-400 max-w-[220px]">
          {{ error() ? tt.renderError + ': ' + error() : tt.empty }}
        </p>
      </div>
    }
  </div>

  <div class="mt-5 grid gap-2" [class]="canCopy ? 'grid-cols-3' : 'grid-cols-2'">
    <button appButton variant="primary" [disabled]="!ready()" (click)="png()">
      <svg lucideDownload class="h-4 w-4"></svg> {{ tt.png }}
    </button>
    <button appButton [disabled]="!ready()" (click)="svg()">
      <svg lucideFileCode2 class="h-4 w-4"></svg> {{ tt.svg }}
    </button>
    @if (canCopy) {
      <button appButton [disabled]="!ready()" (click)="copy()">
        @switch (copied()) {
          @case ('ok') {
            <svg lucideCheck class="h-4 w-4 text-mint-500"></svg> {{ tt.copied }}
          }
          @case ('fail') {
            <svg lucideX class="h-4 w-4 text-red-500"></svg> {{ tt.copyFailed }}
          }
          @default {
            <svg lucideCopy class="h-4 w-4"></svg> {{ tt.copy }}
          }
        }
      </button>
    }
  </div>

  @if (note()) {
    <p class="mt-4 flex gap-2 rounded-2xl bg-mint-50 dark:bg-mint-500/10 px-3.5 py-3 text-xs leading-relaxed text-mint-900 dark:text-mint-200">
      <svg lucideInfo class="mt-px h-3.5 w-3.5 shrink-0 text-mint-600 dark:text-mint-400"></svg>
      <span>{{ note() }}</span>
    </p>
  }
</div>
