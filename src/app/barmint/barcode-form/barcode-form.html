@let d = data();
@let tt = t();

<div>
  <h3 appSectionTitle>{{ tt.barcode.format }}</h3>
  <div class="flex flex-wrap gap-2">
    @for (f of formats; track f.id) {
      <button type="button" (click)="pickFormat(f.id)" [class]="formatClass(d.format === f.id)">{{ f.label }}</button>
    }
  </div>
</div>

<app-field
  [label]="tt.barcode.content"
  [value]="d.text"
  [error]="errors().text"
  [t]="tt"
  [required]="true"
  [mono]="true"
  [spellcheck]="false"
  [placeholder]="sample[d.format]"
  [inputMode]="numeric() ? 'numeric' : 'text'"
  (changed)="set('text', $event)"
/>

<div class="grid grid-cols-2 gap-4">
  @for (k of colors; track k) {
    <label class="flex items-center gap-3 rounded-2xl bg-black/[0.03] dark:bg-white/[0.05] p-3 cursor-pointer">
      <input
        type="color"
        [value]="d[k]"
        (input)="set(k, value($event))"
        class="h-10 w-10 cursor-pointer rounded-full border-0 bg-transparent p-0 [&::-webkit-color-swatch]:rounded-full [&::-webkit-color-swatch]:border-black/10 [&::-webkit-color-swatch-wrapper]:p-0"
      />
      <span>
        <span class="block text-[13px] font-medium text-neutral-700 dark:text-neutral-200">{{ tt.barcode[k] }}</span>
        <span class="block font-mono text-xs text-neutral-400 uppercase">{{ d[k] }}</span>
      </span>
    </label>
  }
</div>

<div class="space-y-5">
  <label class="block">
    <span class="flex justify-between text-[13px] font-medium text-neutral-600 dark:text-neutral-300 mb-2 ml-1">
      {{ tt.barcode.size }}
      <span class="font-mono text-neutral-400">{{ d.scale }}×</span>
    </span>
    <input
      type="range"
      min="1"
      max="10"
      [value]="d.scale"
      (input)="set('scale', +value($event))"
      class="w-full accent-mint-500"
    />
  </label>
  @if (d.format !== 'qrcode') {
    <label class="flex items-center justify-between ml-1 cursor-pointer">
      <span class="text-[13px] font-medium text-neutral-600 dark:text-neutral-300">{{ tt.barcode.showText }}</span>
      <button
        type="button"
        role="switch"
        [attr.aria-checked]="d.showText"
        (click)="set('showText', !d.showText)"
        class="relative h-7 w-12 rounded-full transition-colors"
        [class]="d.showText ? 'bg-mint-500' : 'bg-black/15 dark:bg-white/20'"
      >
        <span
          class="absolute top-0.5 left-0.5 h-6 w-6 rounded-full bg-white shadow transition-transform"
          [class.translate-x-5]="d.showText"
        ></span>
      </button>
    </label>
  }
</div>
