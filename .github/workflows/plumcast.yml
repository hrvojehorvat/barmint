name: Plumcast APK

# Builds the Android APK (phones, Android TV, Fire TV; armeabi-v7a + arm64-v8a in one file).
# - Push to the `plumcast` branch (Plumcast changes only), or run it by hand once this file is on master
#   (Actions → Plumcast APK → Run workflow): the APK is attached to the run.
# - Push a tag `plumcast-v1.2.3`: same build, plus a GitHub Release with the APK.
# Signing: with the PLUMCAST_KEYSTORE_* secrets set, the APK is signed with your keystore; without them
# it is signed with the generic debug key (fine for testing, but switching keys later means uninstalling first).
on:
  workflow_dispatch:
  push:
    branches: [plumcast]
    paths: ['apps/plumcast/**', '.github/workflows/plumcast.yml']
    tags: ['plumcast-v*']

permissions:
  contents: write

concurrency:
  group: plumcast-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/plumcast
    env:
      CI: 1
      HAS_KEYSTORE: ${{ secrets.PLUMCAST_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/plumcast/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      - name: Check
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Use the release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.PLUMCAST_KEYSTORE_BASE64 }}
        run: |
          test -f android/app/build.gradle || { echo "::error::android/app/build.gradle not found (template changed?)"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/plumcast.keystore"
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  plumcast {
                      storeFile file(System.getenv('PLUMCAST_KEYSTORE_PATH'))
                      storePassword System.getenv('PLUMCAST_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('PLUMCAST_KEY_ALIAS')
                      keyPassword System.getenv('PLUMCAST_KEY_PASSWORD')
                  }
              }
              buildTypes.release.signingConfig(signingConfigs.plumcast)
          }
          EOF

      - name: Build the APK
        working-directory: apps/plumcast/android
        env:
          PLUMCAST_KEYSTORE_PATH: ${{ runner.temp }}/plumcast.keystore
          PLUMCAST_KEYSTORE_PASSWORD: ${{ secrets.PLUMCAST_KEYSTORE_PASSWORD }}
          PLUMCAST_KEY_ALIAS: ${{ secrets.PLUMCAST_KEY_ALIAS }}
          PLUMCAST_KEY_PASSWORD: ${{ secrets.PLUMCAST_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        id: apk
        run: |
          version=$(node -p "require('./app.json').expo.version")
          name="plumcast-${version}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Built $name ($(du -h "$name" | cut -f1)), signed with $([ "$HAS_KEYSTORE" = true ] && echo 'the release keystore' || echo 'the debug key')" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: apps/plumcast/${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/plumcast-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Plumcast ${{ github.ref_name }}
          files: apps/plumcast/${{ steps.apk.outputs.name }}
          generate_release_notes: true
