name: Test & deploy to Azure Static Web Apps

# Every push to main: lint, tests, build, then upload dist/ to BarMint's own Azure Static Web App
# (barmint.mrvoje.com). Pull requests only test and build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Secrets can't be used in `if:` directly; expose whether the deploy token is set.
      HAS_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Absolute URL for link previews (og:image).
          SITE_URL: https://barmint.mrvoje.com

      # Uploads the already-built dist/ folder; Azure does not build anything itself.
      # Skipped until the token secret exists (and for pull requests).
      - uses: Azure/static-web-apps-deploy@v1
        if: env.HAS_TOKEN == 'true' && github.event_name != 'pull_request'
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
