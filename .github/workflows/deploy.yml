name: Test & deploy to Azure Static Web Apps

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Secrets can't be used in `if:` directly; expose whether the deploy token is set.
      HAS_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Absolute URL for link previews; set under Settings → Secrets and variables → Actions → Variables.
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}

      # Uploads the already-built dist/ folder; Azure does not build anything itself.
      # Skipped until the token secret exists, so pushes before the Azure setup still run tests + build.
      - uses: Azure/static-web-apps-deploy@v1
        if: env.HAS_TOKEN == 'true'
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
